<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Image to Video Tool - AU Automation</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
}

.container {
    width: 100%;
    max-width: 820px;
    margin: 45px auto;
    padding: 20px;
}

.card {
    background: #ffffff;
    padding: 32px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.logo-icon {
    font-size: 42px;
    margin-bottom: 5px;
}

h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 700;
    color: #111827;
}

.brand {
    margin-top: 8px;
    font-size: 18px;
    font-weight: 700;
    color: #d60000;
    letter-spacing: 1px;
}

.subtitle {
    margin-top: 7px;
    color: #6b7280;
    font-size: 15px;
}

.section {
    margin-top: 20px;
}

label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
    color: #1f2937;
}

input[type="file"],
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    background: #ffffff;
    font-size: 16px;
}

input[type="file"]:focus,
select:focus {
    outline: none;
    border-color: #888;
}

#preview {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
    gap: 10px;
    margin-top: 15px;
}

.preview-item {
    position: relative;
}

.preview-item img {
    width: 100%;
    height: 105px;
    object-fit: cover;
    border-radius: 9px;
    border: 1px solid #ddd;
}

.preview-number {
    position: absolute;
    top: 5px;
    left: 5px;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 3px 7px;
    border-radius: 5px;
    font-size: 12px;
}

.info {
    margin-top: 8px;
    font-size: 13px;
    color: #6b7280;
}

#createButton {
    width: 100%;
    margin-top: 28px;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #111111;
    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
}

#createButton:hover {
    background: #222222;
}

#createButton:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

#status {
    text-align: center;
    margin-top: 18px;
    font-weight: 700;
    color: #333;
}

.progress-container {
    width: 100%;
    height: 8px;
    background: #e5e7eb;
    border-radius: 10px;
    margin-top: 12px;
    overflow: hidden;
    display: none;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: #d60000;
    transition: width 0.2s ease;
}

#download {
    display: none;
    text-decoration: none;
}

#download button {
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: #d60000;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

#download button:hover {
    background: #b50000;
}

.footer {
    text-align: center;
    margin-top: 25px;
    font-size: 12px;
    color: #9ca3af;
}

canvas {
    display: none;
}

@media (max-width: 600px) {

    .container {
        margin: 15px auto;
        padding: 10px;
    }

    .card {
        padding: 22px;
    }

    h1 {
        font-size: 26px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="card">

    <div class="header">

        <div class="logo-icon">🎬</div>

        <h1>Free Image to Video</h1>

        <div class="brand">
            AU Automation
        </div>

        <div class="subtitle">
            Professional Image to Video Tool
        </div>

    </div>


    <!-- IMAGE SELECTION -->

    <div class="section">

        <label>
            Select Images
        </label>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            multiple
        >

        <div class="info">
            You can select multiple images at once.
        </div>

        <div id="preview"></div>

    </div>


    <!-- EFFECT -->

    <div class="section">

        <label>
            Effect
        </label>

        <select id="effect">

            <option value="zoomIn">
                Zoom In — 100% → 135%
            </option>

            <option value="zoomOut">
                Zoom Out — 130% → 100%
            </option>

        </select>

    </div>


    <!-- DURATION -->

    <div class="section">

        <label>
            Duration per Image
        </label>

        <select id="duration">

            <option value="3">
                3 seconds
            </option>

            <option value="5" selected>
                5 seconds
            </option>

            <option value="10">
                10 seconds
            </option>

            <option value="15">
                15 seconds
            </option>

        </select>

    </div>


    <!-- QUALITY -->

    <div class="section">

        <label>
            Video Quality
        </label>

        <select id="quality">

            <option value="480">
                480p - Faster
            </option>

            <option value="720">
                720p
            </option>

        </select>

    </div>


    <!-- CREATE -->

    <button id="createButton">
        🚀 Create Video
    </button>


    <!-- STATUS -->

    <div id="status"></div>

    <div class="progress-container" id="progressContainer">

        <div id="progressBar"></div>

    </div>


    <!-- DOWNLOAD -->

    <a id="download">

        <button>
            ⬇️ Download Video
        </button>

    </a>


    <canvas id="canvas"></canvas>


    <div class="footer">
        Free Image to Video Tool by AU Automation
    </div>

</div>

</div>


<script>

const imageInput =
    document.getElementById("imageInput");

const preview =
    document.getElementById("preview");

const createButton =
    document.getElementById("createButton");

const status =
    document.getElementById("status");

const download =
    document.getElementById("download");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const progressContainer =
    document.getElementById("progressContainer");

const progressBar =
    document.getElementById("progressBar");


let files = [];


/* =========================
   IMAGE SELECTION
========================= */

imageInput.addEventListener("change", () => {

    files = Array.from(imageInput.files);

    preview.innerHTML = "";

    files.forEach((file, index) => {

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "preview-item";

        const img =
            document.createElement("img");

        img.src =
            URL.createObjectURL(file);

        const number =
            document.createElement("div");

        number.className =
            "preview-number";

        number.innerText =
            index + 1;

        wrapper.appendChild(img);
        wrapper.appendChild(number);

        preview.appendChild(wrapper);

    });

    status.innerText =
        files.length +
        " image(s) selected.";

});


/* =========================
   LOAD IMAGE
========================= */

function loadImage(file) {

    return new Promise((resolve, reject) => {

        const img =
            new Image();

        img.onload = () => {

            resolve(img);

        };

        img.onerror = reject;

        img.src =
            URL.createObjectURL(file);

    });

}


/* =========================
   DRAW FRAME
========================= */

function drawFrame(
    img,
    progress,
    effect,
    width,
    height
) {

    let scale;


    /*
        ZOOM IN
        100% → 135%

        ZOOM OUT
        130% → 100%
    */

    if (effect === "zoomIn") {

        scale =
            1.00 +
            (progress * 0.35);

    } else {

        scale =
            1.30 -
            (progress * 0.30);

    }


    const imageRatio =
        img.width / img.height;

    const canvasRatio =
        width / height;


    let drawWidth;
    let drawHeight;


    if (imageRatio > canvasRatio) {

        drawHeight =
            height * scale;

        drawWidth =
            drawHeight * imageRatio;

    } else {

        drawWidth =
            width * scale;

        drawHeight =
            drawWidth / imageRatio;

    }


    const x =
        (width - drawWidth) / 2;

    const y =
        (height - drawHeight) / 2;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    ctx.drawImage(
        img,
        x,
        y,
        drawWidth,
        drawHeight
    );

}


/* =========================
   PROCESS IMAGE
========================= */

function processImage(
    img,
    duration,
    effect,
    width,
    height
) {

    return new Promise(resolve => {

        const start =
            performance.now();


        function frame(now) {

            const elapsed =
                now - start;


            const progress =
                Math.min(
                    elapsed /
                    (duration * 1000),
                    1
                );


            drawFrame(
                img,
                progress,
                effect,
                width,
                height
            );


            if (progress < 1) {

                requestAnimationFrame(frame);

            } else {

                resolve();

            }

        }


        requestAnimationFrame(frame);

    });

}


/* =========================
   CREATE VIDEO
========================= */

async function createVideo() {

    if (files.length === 0) {

        alert(
            "Please select at least one image."
        );

        return;

    }


    createButton.disabled = true;

    download.style.display =
        "none";

    progressContainer.style.display =
        "block";

    progressBar.style.width =
        "0%";


    const duration =
        Number(
            document.getElementById(
                "duration"
            ).value
        );


    const effect =
        document.getElementById(
            "effect"
        ).value;


    const quality =
        Number(
            document.getElementById(
                "quality"
            ).value
        );


    let width;
    let height;


    if (quality === 720) {

        width = 1280;
        height = 720;

    } else {

        width = 854;
        height = 480;

    }


    canvas.width =
        width;

    canvas.height =
        height;


    const stream =
        canvas.captureStream(30);


    let mimeType =
        "video/webm;codecs=vp9";


    if (
        !MediaRecorder.isTypeSupported(
            mimeType
        )
    ) {

        mimeType =
            "video/webm";

    }


    const recorder =
        new MediaRecorder(
            stream,
            {
                mimeType:
                    mimeType
            }
        );


    const chunks = [];


    recorder.ondataavailable =
        event => {

            if (
                event.data.size > 0
            ) {

                chunks.push(
                    event.data
                );

            }

        };


    const stopped =
        new Promise(resolve => {

            recorder.onstop =
                resolve;

        });


    recorder.start();


    try {

        /*
            Process images
            one by one.
        */

        for (
            let i = 0;
            i < files.length;
            i++
        ) {

            status.innerText =
                `Processing image ${
                    i + 1
                } of ${
                    files.length
                }...`;


            const img =
                await loadImage(
                    files[i]
                );


            await processImage(
                img,
                duration,
                effect,
                width,
                height
            );


            const percent =
                Math.round(
                    (
                        (i + 1) /
                        files.length
                    ) * 100
                );


            progressBar.style.width =
                percent + "%";

        }


        status.innerText =
            "Finalizing video...";


        recorder.stop();


        await stopped;


        const blob =
            new Blob(
                chunks,
                {
                    type:
                        "video/webm"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        download.href =
            url;


        download.download =
            "AU-Automation-Image-to-Video.webm";


        download.style.display =
            "block";


        status.innerText =
            "✅ Video ready!";


        progressBar.style.width =
            "100%";


    } catch (error) {

        console.error(error);

        status.innerText =
            "❌ Something went wrong. Please try again.";

    }


    createButton.disabled =
        false;

}


createButton.addEventListener(
    "click",
    createVideo
);

</script>

</body>
</html>
