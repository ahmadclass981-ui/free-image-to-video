<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Image to Video</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      cursor: pointer;
      background: #111;
      color: white;
      border: none;
    }

    button:hover {
      opacity: 0.85;
    }

    #status {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }

    #preview {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }

    #preview img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>🎬 Free Image to Video</h1>

    <div class="subtitle">
      Turn images into simple Zoom In / Zoom Out videos
    </div>

    <label>Select Images</label>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
      multiple
    >

    <div id="preview"></div>

    <label>Effect</label>

    <select id="effect">
      <option value="zoomIn">Zoom In</option>
      <option value="zoomOut">Zoom Out</option>
    </select>

    <label>Duration per Image (seconds)</label>

    <input
      type="number"
      id="duration"
      value="5"
      min="2"
      max="15"
    >

    <label>Video Quality</label>

    <select id="quality">
      <option value="720">720p</option>
      <option value="480">480p - Faster</option>
    </select>

    <button onclick="createVideo()">
      🚀 Create Video
    </button>

    <div id="status"></div>

    <canvas id="canvas"></canvas>

    <a
      id="download"
      style="display:none; text-decoration:none;"
    >
      <button>
        ⬇️ Download Video
      </button>
    </a>

  </div>

</div>


<script>

const imageInput =
  document.getElementById("imageInput");

const preview =
  document.getElementById("preview");

let images = [];


imageInput.addEventListener("change", function() {

  images = Array.from(this.files);

  preview.innerHTML = "";

  images.forEach(file => {

    const img =
      document.createElement("img");

    img.src =
      URL.createObjectURL(file);

    preview.appendChild(img);

  });

});


async function loadImage(file) {

  return new Promise((resolve, reject) => {

    const img = new Image();

    img.onload = () => resolve(img);

    img.onerror = reject;

    img.src =
      URL.createObjectURL(file);

  });

}


async function createVideo() {

  if (images.length === 0) {

    alert("Please select at least one image.");

    return;

  }


  const status =
    document.getElementById("status");

  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d");


  const quality =
    document.getElementById("quality").value;

  const duration =
    Number(
      document.getElementById("duration").value
    );

  const effect =
    document.getElementById("effect").value;


  let width;
  let height;


  if (quality === "720") {

    width = 1280;
    height = 720;

  } else {

    width = 854;
    height = 480;

  }


  canvas.width = width;
  canvas.height = height;


  const stream =
    canvas.captureStream(30);


  const recorder =
    new MediaRecorder(
      stream,
      {
        mimeType: "video/webm"
      }
    );


  const chunks = [];


  recorder.ondataavailable = event => {

    if (event.data.size > 0) {

      chunks.push(event.data);

    }

  };


  recorder.onstop = () => {

    const blob =
      new Blob(
        chunks,
        {
          type: "video/webm"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const download =
      document.getElementById("download");


    download.href = url;

    download.download =
      "image-to-video.webm";

    download.style.display =
      "block";


    status.innerText =
      "✅ Video ready!";

  };


  recorder.start();


  const totalFrames =
    duration * 30;


  for (
    let imageIndex = 0;
    imageIndex < images.length;
    imageIndex++
  ) {

    const img =
      await loadImage(
        images[imageIndex]
      );


    for (
      let frame = 0;
      frame < totalFrames;
      frame++
    ) {

      const progress =
        frame / totalFrames;


      let scale;


      if (effect === "zoomIn") {

        scale =
          1 + progress * 0.20;

      } else {

        scale =
          1.20 - progress * 0.20;

      }


      const imageRatio =
        img.width / img.height;

      const canvasRatio =
        width / height;


      let drawWidth;
      let drawHeight;


      if (imageRatio > canvasRatio) {

        drawHeight =
          height * scale;

        drawWidth =
          drawHeight * imageRatio;

      } else {

        drawWidth =
          width * scale;

        drawHeight =
          drawWidth / imageRatio;

      }


      const x =
        (width - drawWidth) / 2;

      const y =
        (height - drawHeight) / 2;


      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      ctx.drawImage(
        img,
        x,
        y,
        drawWidth,
        drawHeight
      );


      await new Promise(
        requestAnimationFrame
      );

    }


    status.innerText =
      `Creating video... ${imageIndex + 1}/${images.length}`;

  }


  recorder.stop();

}

</script>

</body>
</html>
