<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Image to Video</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #222;
}

.container {
  max-width: 800px;
  margin: 40px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 18px;
  margin-bottom: 8px;
}

input,
select,
button {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  margin-top: 20px;
  background: #111;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover {
  opacity: 0.85;
}

#preview {
  margin-top: 15px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 10px;
}

#preview img {
  width: 100%;
  height: 110px;
  object-fit: cover;
  border-radius: 8px;
}

#status {
  margin-top: 18px;
  text-align: center;
  font-weight: bold;
}

#download {
  display: none;
  text-decoration: none;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🎬 Free Image to Video</h1>

<div class="subtitle">
Create simple Zoom In / Zoom Out videos
</div>

<label>Select Images</label>

<input
  type="file"
  id="imageInput"
  accept="image/*"
  multiple
>

<div id="preview"></div>

<label>Effect</label>

<select id="effect">

<option value="zoomIn">
Zoom In
</option>

<option value="zoomOut">
Zoom Out
</option>

</select>

<label>Duration per Image</label>

<select id="duration">

<option value="3">
3 seconds
</option>

<option value="5" selected>
5 seconds
</option>

<option value="10">
10 seconds
</option>

<option value="15">
15 seconds
</option>

</select>

<label>Video Quality</label>

<select id="quality">

<option value="480">
480p - Faster
</option>

<option value="720">
720p
</option>

</select>

<button id="createButton">
🚀 Create Video
</button>

<div id="status"></div>

<canvas
  id="canvas"
  style="display:none;">
</canvas>

<a id="download">

<button>
⬇️ Download Video
</button>

</a>

</div>

</div>


<script>

const imageInput =
document.getElementById("imageInput");

const preview =
document.getElementById("preview");

const createButton =
document.getElementById("createButton");

const status =
document.getElementById("status");

const download =
document.getElementById("download");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


let files = [];


imageInput.addEventListener("change", () => {

  files = Array.from(imageInput.files);

  preview.innerHTML = "";

  files.forEach(file => {

    const img =
    document.createElement("img");

    img.src =
    URL.createObjectURL(file);

    preview.appendChild(img);

  });

});


function loadImage(file) {

  return new Promise((resolve, reject) => {

    const img = new Image();

    img.onload = () => resolve(img);

    img.onerror = reject;

    img.src =
    URL.createObjectURL(file);

  });

}


function drawImageFrame(
  img,
  progress,
  effect,
  width,
  height
) {

  let scale;

  if (effect === "zoomIn") {

    scale =
    1 + (progress * 0.20);

  } else {

    scale =
    1.20 - (progress * 0.20);

  }


  const imageRatio =
  img.width / img.height;

  const canvasRatio =
  width / height;


  let drawWidth;
  let drawHeight;


  if (imageRatio > canvasRatio) {

    drawHeight =
    height * scale;

    drawWidth =
    drawHeight * imageRatio;

  } else {

    drawWidth =
    width * scale;

    drawHeight =
    drawWidth / imageRatio;

  }


  const x =
  (width - drawWidth) / 2;

  const y =
  (height - drawHeight) / 2;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  ctx.drawImage(
    img,
    x,
    y,
    drawWidth,
    drawHeight
  );

}


function recordImage(
  img,
  duration,
  effect,
  width,
  height
) {

  return new Promise(resolve => {

    const start =
    performance.now();

    function render(now) {

      const elapsed =
      now - start;

      const progress =
      Math.min(
        elapsed / (duration * 1000),
        1
      );


      drawImageFrame(
        img,
        progress,
        effect,
        width,
        height
      );


      if (progress < 1) {

        requestAnimationFrame(render);

      } else {

        resolve();

      }

    }


    requestAnimationFrame(render);

  });

}


async function createVideo() {

  if (files.length === 0) {

    alert("Please select at least one image.");

    return;

  }


  createButton.disabled = true;

  download.style.display = "none";


  const duration =
  Number(
    document.getElementById("duration").value
  );


  const effect =
  document.getElementById("effect").value;


  const quality =
  Number(
    document.getElementById("quality").value
  );


  let width;
  let height;


  if (quality === 720) {

    width = 1280;
    height = 720;

  } else {

    width = 854;
    height = 480;

  }


  canvas.width = width;
  canvas.height = height;


  const stream =
  canvas.captureStream(30);


  let mimeType =
  "video/webm;codecs=vp9";


  if (!MediaRecorder.isTypeSupported(mimeType)) {

    mimeType =
    "video/webm";

  }


  const recorder =
  new MediaRecorder(
    stream,
    {
      mimeType: mimeType
    }
  );


  const chunks = [];


  recorder.ondataavailable = event => {

    if (event.data.size > 0) {

      chunks.push(event.data);

    }

  };


  const recordingFinished =
  new Promise(resolve => {

    recorder.onstop = resolve;

  });


  recorder.start();


  try {

    for (
      let i = 0;
      i < files.length;
      i++
    ) {

      status.innerText =
      `Processing image ${i + 1} of ${files.length}...`;


      const img =
      await loadImage(files[i]);


      await recordImage(
        img,
        duration,
        effect,
        width,
        height
      );

    }


    status.innerText =
    "Finalizing video...";


    recorder.stop();


    await recordingFinished;


    const blob =
    new Blob(
      chunks,
      {
        type: "video/webm"
      }
    );


    const url =
    URL.createObjectURL(blob);


    download.href = url;

    download.download =
    "image-to-video.webm";


    download.style.display =
    "block";


    status.innerText =
    "✅ Video ready!";


  } catch (error) {

    console.error(error);

    status.innerText =
    "❌ Something went wrong.";

  }


  createButton.disabled = false;

}


createButton.addEventListener(
  "click",
  createVideo
);

</script>

</body>
</html>
